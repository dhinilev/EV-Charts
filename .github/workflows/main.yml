name: Build EV Charts APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project folder
        run: |
          P=$(dirname "$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)")
          echo "PROJ=$P" >> $GITHUB_ENV
          echo "Project folder: $P"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release APK
        working-directory: ${{ env.PROJ }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp "$PROJ/app/build/outputs/apk/release/app-release.apk" EV-Charts.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EV-Charts-apk
          path: EV-Charts.apk
