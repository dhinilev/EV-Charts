name: Build EV Charts APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Find project folder (unzips the uploaded zip if needed)
        run: |
          if [ -f settings.gradle.kts ] && [ -d app ]; then
            P=.
          else
            Z=$(ls -1 *.zip 2>/dev/null | sort -V | tail -1)
            if [ -z "$Z" ]; then
              echo "::error::No app folder and no zip found in the repo."
              ls -la
              exit 1
            fi
            echo "Using $Z"
            rm -rf _src && mkdir _src && unzip -q "$Z" -d _src
            F=$(find _src -name settings.gradle.kts | head -1)
            if [ -z "$F" ]; then
              echo "::error::$Z does not contain settings.gradle.kts"
              exit 1
            fi
            P=$(dirname "$F")
          fi
          echo "PROJ=$P" >> $GITHUB_ENV
          echo "Project folder: $P"
          ls -la "$P" "$P/app"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK (preinstalled on the runner)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > "$PROJ/local.properties"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release APK
        working-directory: ${{ env.PROJ }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp "$PROJ/app/build/outputs/apk/release/app-release.apk" EV-Charts.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EV-Charts-apk
          path: EV-Charts.apk
